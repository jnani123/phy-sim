<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNANI Physics | Angular Kinematics</title>
  <link rel="stylesheet" href="../css/simulation-assets.css?v=20261017-1">
  <script src="../js/shared/simulation-tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/shared/simulation-math.js"></script>
  <script src="../js/shared/simulation-teaching-components.js"></script>
  <script src="../js/physics/angular-kinematics.js"></script>
  <style>
    .jnani-ak-visual{display:flex;flex:1;min-height:0;flex-direction:column;background:#0b1220}
    .jnani-ak-scene{position:relative;display:flex;min-height:330px;flex:1;align-items:center;justify-content:center;overflow:hidden;padding:12px;background:radial-gradient(#1e293b 1px,transparent 1px);background-size:24px 24px}
    .jnani-ak-scene svg{display:block;width:100%;height:100%;min-height:300px;max-height:590px;cursor:grab;touch-action:none}
    .jnani-ak-scene svg.is-dragging{cursor:grabbing}
    .jnani-ak-orbit{fill:none;stroke:#64748b;stroke-width:2}
    #angular-scene.is-focus-path .jnani-ak-orbit{stroke:#86efac;stroke-width:3}
    #angular-scene.is-focus-position .jnani-ak-radius,#angular-scene.is-focus-position .jnani-ak-angle{stroke-width:4}
    #angular-scene.is-focus-position .jnani-ak-particle{stroke:#f8fafc;stroke-width:3}
    #angular-scene.is-focus-requested #ak-alpha-indicator{stroke-width:6;filter:drop-shadow(0 0 5px #fbbf24)}
    .jnani-ak-radius{stroke:#22c55e;stroke-width:2}
    .jnani-ak-angle{fill:none;stroke:#a78bfa;stroke-width:3}
    .jnani-ak-center{fill:#fbbf24;stroke:#fde68a;stroke-width:2}
    .jnani-ak-particle{fill:#38bdf8;stroke:#e0f2fe;stroke-width:2}
    .jnani-ak-vector{stroke:#f97316;stroke-width:3}
    .jnani-ak-label{fill:#cbd5e1;font:13px var(--jnani-sim-font)}
    .jnani-ak-mono{fill:#86efac;font:600 12px var(--jnani-sim-mono)}
    .jnani-ak-clock,.jnani-ak-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;border-top:1px solid #1e293b;background:var(--jnani-sim-panel);padding:9px 12px;color:#cbd5e1;font:11px var(--jnani-sim-mono)}
    .jnani-ak-clock strong{color:#86efac}
    .jnani-ak-visual[data-mode="understand"] [data-clock-theta-wrap],.jnani-ak-visual[data-mode="understand"] [data-clock-direction-wrap],.jnani-ak-visual[data-mode="understand"] [data-clock-alpha-wrap]{display:none}
    .jnani-ak-legend{background:#0f172a;font-size:10px}
    .jnani-ak-legend span{display:inline-flex;align-items:center;gap:6px}
    .jnani-ak-dot{width:9px;height:9px;border-radius:50%;background:#38bdf8}
    .jnani-ak-view{display:flex;align-items:center;gap:7px}
    .jnani-ak-view button,.jnani-ak-points button{border:1px solid #334155;border-radius:8px;background:#1e293b;padding:6px 9px;color:#cbd5e1;font-size:11px}
    .jnani-ak-view button:hover,.jnani-ak-points button:hover{border-color:#22c55e;color:#bbf7d0}
    .jnani-ak-question{color:#e2e8f0}
    .jnani-ak-equation{overflow-y:hidden}
    .jnani-ak-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
    .jnani-ak-controls{display:grid;gap:10px;margin-top:14px}
    .jnani-ak-time{display:grid;grid-template-columns:55px minmax(0,1fr) 74px;align-items:center;gap:10px;color:#cbd5e1;font-size:12px}
    .jnani-ak-time input{width:100%;accent-color:#22c55e}
    .jnani-ak-time output{color:#86efac;text-align:right;font:12px var(--jnani-sim-mono)}
    .jnani-ak-points{display:flex;flex-wrap:wrap;gap:7px}
    .jnani-ak-toggles{display:flex;flex-wrap:wrap;gap:14px;color:#cbd5e1;font-size:12px}
    .jnani-ak-toggles label{display:inline-flex;align-items:center;gap:7px}
    .jnani-ak-toggles input{accent-color:#22c55e}
    .jnani-ak-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
    .jnani-ak-values>div{min-width:0;border:1px solid #334155;border-radius:9px;background:#0d1725;padding:10px}
    .jnani-ak-values small{display:block;color:#94a3b8;font-size:10px}
    .jnani-ak-values strong{display:block;overflow-wrap:anywhere;margin-top:5px;color:#e2e8f0;font:600 13px var(--jnani-sim-mono)}
    .jnani-ak-highlight{border-color:#2b6540!important;background:#12231a!important}
    .jnani-ak-highlight strong{color:#86efac}
    .jnani-ak-note{margin-top:12px;border-left:2px solid #38bdf8;padding-left:10px;color:#aab7c5;font-size:11px;line-height:1.6}
    @media(min-width:761px) and (max-width:1199px){.jnani-simulation .jnani-sim-header{flex-wrap:wrap;gap:8px;padding:9px 16px}.jnani-simulation .jnani-sim-header-main{flex:1 1 100%}.jnani-simulation .jnani-sim-header-actions{flex:1 1 100%;justify-content:flex-end}.jnani-simulation .jnani-sim-metadata{max-width:52vw;overflow:hidden;text-overflow:ellipsis}}
    @media(max-width:760px){.jnani-simulation .jnani-sim-metadata{max-width:calc(100vw - 140px)}.jnani-ak-scene{min-height:260px;padding:5px}.jnani-ak-scene svg{min-height:250px}.jnani-ak-values{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){.jnani-ak-scene *{scroll-behavior:auto!important}}
  </style>
</head>
<body class="jnani-simulation bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="simulation-shell-root"></div>
  <script src="../js/shared/simulation-shell.js"></script>
  <script src="../js/simulations/angular-kinematics.js?v=20261017-20"></script>
</body>
</html>
