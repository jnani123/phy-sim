<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNANI Physics | Kepler's Third Law</title>
  <link rel="stylesheet" href="../css/simulation-assets.css?v=20261017-1">
  <script src="../js/shared/simulation-tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/shared/simulation-math.js"></script>
  <script src="../js/shared/simulation-teaching-components.js"></script>
  <script src="../js/physics/kepler-orbital-period.js"></script>
  <style>
    .jnani-kep-visual{display:flex;flex:1;min-height:0;flex-direction:column;background:#0b1220}
    .jnani-kep-scene{position:relative;display:flex;min-height:330px;flex:1;align-items:center;justify-content:center;overflow:hidden;padding:12px;background:radial-gradient(#1e293b 1px,transparent 1px);background-size:24px 24px}
    .jnani-kep-scene svg{display:block;width:100%;height:100%;min-height:300px;max-height:590px;cursor:grab;touch-action:none}
    .jnani-kep-scene svg.is-dragging{cursor:grabbing}
    .jnani-kep-system{transition:opacity .2s ease}
    .jnani-kep-system.is-muted{opacity:.22}
    .jnani-kep-system.is-focus .jnani-kep-orbit{stroke:#86efac;stroke-width:2.8}
    .jnani-kep-system.is-focus .jnani-kep-planet{stroke:#f8fafc;stroke-width:2.5}
    .jnani-kep-system-title{fill:#e2e8f0;font:700 13px var(--jnani-sim-font);letter-spacing:1.5px}
    .jnani-kep-orbit{fill:none;stroke:#64748b;stroke-width:1.8}
    .jnani-kep-radius{stroke:#22c55e;stroke-width:1.5;stroke-dasharray:5 4}
    .jnani-kep-label{fill:#cbd5e1;font:13px var(--jnani-sim-font)}
    .jnani-kep-radius-label{fill:#86efac;font:600 12px var(--jnani-sim-mono)}
    .jnani-kep-star{fill:#fbbf24;stroke:#fde68a;stroke-width:1.5}
    .jnani-kep-planet{fill:#38bdf8;stroke:#bae6fd;stroke-width:1.5}
    .jnani-kep-planet-label{fill:#bae6fd;font:700 12px var(--jnani-sim-mono)}
    .jnani-kep-clock{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;border-top:1px solid #1e293b;background:var(--jnani-sim-panel);padding:9px 12px;color:#cbd5e1;font:11px var(--jnani-sim-mono)}
    .jnani-kep-clock strong{color:#86efac}
    .jnani-kep-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 17px;border-top:1px solid #1e293b;background:#0f172a;padding:8px 12px;color:#cbd5e1;font:10px var(--jnani-sim-mono)}
    .jnani-kep-legend span{display:inline-flex;align-items:center;gap:6px}
    .jnani-kep-dot{width:9px;height:9px;border-radius:50%;background:#fbbf24}
    .jnani-kep-view-controls{display:flex;align-items:center;gap:7px}
    .jnani-kep-view-controls button{min-width:30px;border:1px solid #334155;border-radius:7px;background:#1e293b;padding:5px 8px;color:#cbd5e1;font-size:11px}
    .jnani-kep-view-controls button:hover{background:#334155}
    .jnani-kep-view-controls span{color:#86efac;font:10px var(--jnani-sim-mono)}
    .jnani-kep-systems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .jnani-kep-question{color:#e2e8f0;font-size:15px;line-height:1.8}
    .jnani-kep-system-card{min-width:0;border:1px solid var(--jnani-sim-line);border-radius:10px;background:var(--jnani-sim-panel-soft);padding:12px}
    .jnani-kep-system-card strong{display:block;color:#86efac;font:600 11px var(--jnani-sim-mono)}
    .jnani-kep-system-card div{margin-top:6px;color:#e2e8f0;font-size:13px}
    .jnani-kep-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;margin-top:12px}
    .jnani-kep-control{display:grid;grid-template-columns:minmax(90px,1fr) minmax(95px,1.4fr) 48px;align-items:center;gap:8px;color:#cbd5e1;font-size:11px}
    .jnani-kep-control input{width:100%;accent-color:#22c55e}
    .jnani-kep-control output{color:#86efac;text-align:right;font:11px var(--jnani-sim-mono)}
    .jnani-kep-presets{display:flex;flex-wrap:wrap;gap:7px}
    .jnani-kep-presets button{border:1px solid #334155;border-radius:8px;background:#172338;padding:7px 9px;color:#cbd5e1;font-size:10px}
    .jnani-kep-presets button:hover{border-color:#22c55e;color:#bbf7d0}
    .jnani-kep-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
    .jnani-kep-results>div{min-width:0;border:1px solid #334155;border-radius:9px;background:#0d1725;padding:10px}
    .jnani-kep-results small{display:block;color:#94a3b8;font-size:10px}
    .jnani-kep-results strong{display:block;overflow-wrap:anywhere;margin-top:5px;color:#e2e8f0;font:600 12px var(--jnani-sim-mono)}
    .jnani-kep-result-main{border-color:#2b6540!important;background:#12231a!important}
    .jnani-kep-result-main strong{color:#86efac!important;font-size:16px}
    .jnani-kep-task{margin-top:12px;border-left:2px solid #38bdf8;padding-left:10px;color:#aab7c5;font-size:11px;line-height:1.6}
    .jnani-kep-understand-note{color:#94a3b8;font-size:11px;line-height:1.6}
    .jnani-kep-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
    @media(min-width:761px) and (max-width:1199px){.jnani-simulation .jnani-sim-header{flex-wrap:wrap;gap:8px;padding:9px 16px}.jnani-simulation .jnani-sim-header-main{flex:1 1 100%}.jnani-simulation .jnani-sim-header-actions{flex:1 1 100%;justify-content:flex-end}.jnani-simulation .jnani-sim-metadata{max-width:52vw;overflow:hidden;text-overflow:ellipsis}}
    @media(max-width:760px){.jnani-kep-scene{min-height:260px;padding:5px}.jnani-kep-scene svg{min-height:250px}.jnani-kep-controls{grid-template-columns:1fr}.jnani-kep-control{grid-template-columns:minmax(85px,1fr) minmax(90px,1.2fr) 44px}.jnani-kep-results{grid-template-columns:1fr}.jnani-kep-system-card{padding:9px}.jnani-kep-system-card div{font-size:11px}}
    @media(prefers-reduced-motion:reduce){.jnani-kep-system{transition:none}}
  </style>
</head>
<body class="jnani-simulation bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="simulation-shell-root"></div>
  <script src="../js/shared/simulation-shell.js"></script>
  <script src="../js/simulations/kepler-orbital-period.js?v=20261017-1"></script>
</body>
</html>
