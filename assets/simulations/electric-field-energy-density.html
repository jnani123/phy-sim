<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JNANI Physics | Electric-field energy density</title>
  <link rel="stylesheet" href="../css/simulation-assets.css?v=20261017-1">
  <script src="../js/shared/simulation-tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/shared/simulation-math.js"></script>
  <script src="../js/shared/simulation-teaching-components.js"></script>
  <script src="../js/physics/electric-field-energy-density.js"></script>
  <style>
    .jnani-eed-visual{display:flex;min-height:0;flex:1 1 0%;flex-direction:column;overflow:hidden;background:var(--jnani-sim-bg)}
    .jnani-eed-scene{display:flex;min-height:340px;flex:1 1 0%;align-items:center;justify-content:center;padding:14px;overflow:hidden}
    .jnani-eed-scene svg{display:block;width:min(100%,690px);height:auto;max-height:100%;overflow:visible}
    .jnani-eed-scene svg{cursor:grab;touch-action:none}.jnani-eed-scene svg.is-dragging{cursor:grabbing}
    .jnani-eed-view-controls{display:flex;align-items:center;gap:5px}
    .jnani-eed-view-controls button{min-width:32px;min-height:30px;padding:5px 8px!important}
    .jnani-eed-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;border-top:1px solid #1e293b;background:var(--jnani-sim-panel);padding:9px 12px;color:#cbd5e1;font:var(--jnani-sim-font-xs) var(--jnani-sim-mono)}
    .jnani-eed-legend span{display:inline-flex;align-items:center;gap:6px}.jnani-eed-dot{width:9px;height:9px;border-radius:50%;background:#38bdf8}
    .jnani-eed-controls{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
    .jnani-eed-start{width:100%;min-height:48px;border-radius:12px!important;font-size:14px!important}
    .jnani-eed-scene[data-playback="1"] .eed-field path{filter:drop-shadow(0 0 4px #38bdf8)}
    .jnani-eed-scene[data-playback="2"] .eed-volume path{filter:drop-shadow(0 0 4px #22c55e)}
    .jnani-eed-scene[data-playback="3"] .eed-quantity rect{stroke:#22c55e;stroke-width:2}
    .jnani-eed-question{font-size:var(--jnani-sim-font-body);line-height:1.75;color:#f1f5f9}
    .jnani-eed-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .jnani-eed-option{border:1px solid #334155;border-radius:9px;background:#1e293b;padding:11px 13px;color:#f1f5f9}
    .jnani-eed-option strong{margin-right:8px;color:#93c5fd;font-family:var(--jnani-sim-mono);font-weight:500}
    .jnani-eed-stage-visual{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(180px,.9fr);align-items:center;gap:12px}
    .jnani-eed-stage-visual svg{width:100%;height:auto}
    .jnani-eed-exponents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .jnani-eed-exp-input{width:72px;max-width:100%;border:1px solid #475569;border-radius:7px;background:#0f172a;padding:8px;color:#f8fafc;text-align:center;font:14px var(--jnani-sim-mono)}
    .jnani-eed-exp-row{display:flex;align-items:center;justify-content:center;gap:5px;color:#e2e8f0}
    .jnani-eed-power-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .jnani-eed-power{border:1px solid #334155;border-radius:8px;background:#0f172a;padding:9px;text-align:center}
    .jnani-eed-power strong{display:block;color:#22c55e;font:15px var(--jnani-sim-mono)}
    .jnani-eed-methods{display:flex;flex-wrap:wrap;gap:8px}
    .jnani-eed-message{min-height:24px;color:#94a3b8;font-size:12px}
    .jnani-eed-equation{overflow-wrap:anywhere}
    @media (min-width:761px) and (max-width:1100px){.jnani-simulation .jnani-sim-header{flex-wrap:wrap;gap:8px;padding:9px 12px}.jnani-simulation .jnani-sim-header-main{flex:1 1 100%}.jnani-simulation .jnani-sim-header-actions{width:100%;flex-wrap:wrap;justify-content:space-between}.jnani-simulation .jnani-sim-metadata{max-width:35vw;overflow:hidden;text-overflow:ellipsis}.jnani-simulation .jnani-sim-canvas-toolbar{flex-wrap:wrap}.jnani-simulation .jnani-sim-canvas-toolbar [data-shell-toolbar]{width:100%;justify-content:flex-end}}
    @media(max-width:760px){.jnani-simulation .jnani-sim-canvas-toolbar{flex-wrap:wrap}.jnani-simulation .jnani-sim-canvas-toolbar [data-shell-toolbar]{width:100%;justify-content:flex-end}.jnani-eed-scene{min-height:280px;padding:8px}.jnani-eed-stage-visual{grid-template-columns:1fr}.jnani-eed-options{grid-template-columns:1fr}.jnani-eed-exp-input{width:62px}.jnani-eed-legend{font-size:10px}}
  </style>
</head>
<body class="jnani-simulation bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="simulation-shell-root"></div>
  <script src="../js/shared/simulation-shell.js"></script>
  <script src="../js/simulations/electric-field-energy-density.js?v=20261017-17"></script>
</body>
</html>
